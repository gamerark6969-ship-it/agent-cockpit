services:
  - type: web
    name: agent-cockpit-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: APP_TOKEN
        sync: false
      - key: CONNECTOR_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: AUTOMATION_ENABLED
        value: "false"
      - key: BACKGROUND_WORKER_ENABLED
        value: "false"
      - key: KEEPALIVE_ENABLED
        value: "false"
      - key: OPENCODE_REMOTE_WORKER
        value: "true"
      - key: LOCAL_LLM_REMOTE_WORKER
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AGENTROUTER_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AGENTROUTER_API_KEY
        value: ""
      - key: AGENTROUTER_DEFAULT_MODEL
        value: gemini-3.8-flash
      - key: E2B_API_KEY
        value: ""
      - key: GITHUB_PAT
        value: ""
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: AUTOMATION_YOUTUBE_CLIENT_ID
        sync: false
      - key: AUTOMATION_YOUTUBE_CLIENT_SECRET
        sync: false
      - key: AUTOMATION_YOUTUBE_REDIRECT_URI
        sync: false
      - key: AUTOMATION_FRONTEND_URL
        sync: false
      - key: AUTOMATION_S3_ENDPOINT
        sync: false
      - key: AUTOMATION_S3_ACCESS_KEY
        sync: false
      - key: AUTOMATION_S3_SECRET_KEY
        sync: false
      - key: AUTOMATION_S3_BUCKET
        sync: false
      - key: AUTOMATION_S3_REGION
        sync: false

  - type: web
    name: agent-cockpit-pwa
    runtime: static
    rootDir: pwa
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false
