name: Daily video production (free runner)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: video-production
  cancel-in-progress: false

jobs:
  produce:
    # Public standard runners are free. Private-repository billing is excluded.
    if: github.event.repository.private == false && vars.ENABLE_VIDEO_AUTOMATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: production
      APP_TOKEN: ${{ secrets.APP_TOKEN }}
      CONNECTOR_SECRET: ${{ secrets.CONNECTOR_SECRET }}
      CORS_ORIGINS: ${{ vars.FRONTEND_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTOMATION_ENABLED: "false"
      BACKGROUND_WORKER_ENABLED: "false"
      SANDBOX_BACKEND: docker
      MAX_TASK_RUNTIME_S: "1500"
      WORKER_CONCURRENCY: "1"
      AUTOMATION_YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      AUTOMATION_YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      AUTOMATION_YOUTUBE_REDIRECT_URI: ${{ vars.YOUTUBE_REDIRECT_URI }}
      AUTOMATION_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      AUTOMATION_S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      AUTOMATION_S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      AUTOMATION_S3_BUCKET: ${{ vars.S3_BUCKET }}
      AUTOMATION_S3_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
      LOCAL_LLM_ENABLED: "true"
      LOCAL_LLM_MODEL: qwen3:1.7b
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama/models
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: "1"
      XINGCHI_BASE_URL: ${{ vars.XINGCHI_BASE_URL }}
      XINGCHI_API_KEY: ${{ secrets.XINGCHI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install free renderer and model runtime
        run: |
          pip install -r requirements.txt
      - name: Check for due work
        id: due
        run: |
          echo "needed=$(python -m app.automation.run_once --check-due)" >> "$GITHUB_OUTPUT"
          echo "agent=$(python -m app.automation.run_once --check-agent)" >> "$GITHUB_OUTPUT"
      - name: Build the isolated coding workspace
        if: steps.due.outputs.agent == 'true'
        run: docker build -f Dockerfile.sandbox -t cockpit-sandbox:local .
      - name: Cache local CPU model
        if: steps.due.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: .ollama/models
          key: cpu-qwen3-1.7b-v1
      - name: Set up free inference and narration
        if: steps.due.outputs.needed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng fonts-dejavu-core
          npm install --global opencode-ai@1.19.5
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          ollama serve >/tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then break; fi
            sleep 2
          done
          ollama pull qwen3:1.7b
      - name: Generate, validate, and publish due videos
        if: steps.due.outputs.needed == 'true'
        run: python -m app.automation.run_once --max-jobs 3 --include-agent
