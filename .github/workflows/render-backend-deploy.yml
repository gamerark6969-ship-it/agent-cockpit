name: Deploy backend to Render

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/render-backend-deploy.yml"
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        shell: bash
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK" ]]; then
            echo "::error::Set the RENDER_BACKEND_DEPLOY_HOOK repository secret to enable automatic backend deploys."
            exit 1
          fi

          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request POST "$RENDER_DEPLOY_HOOK")
          if [[ "$status" != "200" && "$status" != "201" ]]; then
            echo "::error::Render deploy hook returned HTTP $status"
            exit 1
          fi

          echo "Render accepted the backend deployment request."
